[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-analysis"
version = "1.0.0"
description = "Multi-asset OHLCV diagnostics, reports/charts, Agent CLI, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
quant = "quant_cli:main"
quantitative-analysis = "main:main"

[tool.setuptools]
py-modules = [
    "app", "main", "quant_cli", "asset_resolver", "china_equity_entry", "data_fetcher",
    "feature_engineering", "visualizer", "quant_models", "ohlcv",
    "analysis_metrics", "asset_catalog", "asset_loader", "charts", "currency",
    "contracts",
]

[tool.setuptools.packages.find]
include = ["data_sources*", "services*", "reporting*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "UP"]
ignore = [
    "B905",  # Avoid strict= churn across existing zip(...) loops during incremental refactors
    "UP017", # Keep timezone.utc alongside datetime.UTC in existing modules until M1 cleanup
    "UP031", # Retain readable %-style diagnostic formatting
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# These modules also preserve import paths used by existing callers.
"app.py" = ["F401"]
"data_fetcher.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
